# The data page: what the tool needs to know, what free data exists to answer
# it, at which level, and what that means for the tool. Drives /data/ in the
# web app and docs/data-ladder.md (regenerate with `python -m engine glossary`).
#
# Built from a desk audit of free, publicly accessible data on 19 November 2026
# (Eurostat dissemination API, publishers' pages). Every source below was opened
# during the audit unless marked "not verified".
#
# Levels: eu = comparable across all or nearly all 27 member states;
# some = several countries, not comparable or not complete; national = one
# country's own data; local = city or region only; none = nothing usable found.

audited: 19 November 2026

intro: >-
  The tool can only be as good as the data behind it. This page sets out what
  the method needs to know, what free official data exists to answer each
  question, whether that data is comparable across the EU, and what that means
  for how far a pan-European tool can go. It covers labour, which the tool
  measures now, and the further steps of the resource ladder: energy,
  materials, and the ecological ceiling and social foundation of the Doughnut.

verdict:
  label: The tool's best estimate
  provenance: >-
    Generated by the tool from the data audit of 19 November 2026. It is a
    machine judgement, not the view of any person or of Modern Money Lab
    Europe, and it will change as reviewers correct it.
  headline: >-
    Not unviable. A pan-European screen works at the level of industries and
    broad sectors: for labour now, and very probably for a programme's energy
    use and climate footprint next. Below that level (trades and occupations,
    physical capacity for energy and materials, most ecological limits, and
    any agreed social floor) comparable EU data runs out, and the method has to
    be taken up nationally or locally with each country's own data.
  points:
    - title: Labour, by industry, across the EU
      text: >-
        Works now. The business surveys give a comparable shortage signal for
        48 of the 64 industries. Job vacancy rates fill most of the rest at
        broad-sector level, including health and social care in 26 of 27
        member states.
    - title: Labour, by trade or occupation
      text: >-
        Pan-European only at a coarse level: broad sector by one-digit
        occupation (for example "craft workers" in "construction"). Of the
        countries checked, only Sweden publishes a free table of detailed
        occupations by industry. This is the clearest point where the tool
        must hand over to national data.
    - title: Energy and climate
      text: >-
        The demand side is feasible across the EU: Eurostat publishes energy
        use and emissions for the same 64 industries the tool already uses,
        so a programme's energy needs and emissions can be estimated for every
        member state. The supply side is not: grid connection capacity and
        installer numbers exist only nationally, if at all.
    - title: Materials
      text: >-
        A programme's material needs by industry come only from a research
        database with a non-commercial licence. But the same business surveys
        the tool already reads also ask firms about shortages of materials and
        equipment, by industry, so a materials risk signal could follow the
        labour method closely.
    - title: Doughnut limits
      text: >-
        Climate and material footprints can be compared with a fair share of
        the planetary boundary for every member state, if the share is stated
        openly. Nitrogen, phosphorus, land, water and biodiversity rest on
        dated research data or national studies. Social deprivation is measured
        well across the EU (including energy poverty), but there is no agreed
        EU floor: any floor the tool draws is a stated choice. City-level
        Doughnuts need local data.
  threshold: >-
    The threshold sits at industry and broad-sector level, for signals that
    every member state measures the same way. Above it, a pan-European tool can
    compare countries. Below it, the method is a framework for national and
    local partners to run with their own data, and results from different
    countries cannot be set side by side.

levels:
  eu: Comparable across the EU
  some: Some countries only
  national: National data only
  local: Local data only
  none: Nothing usable found

ladder:
  - step: What a programme asks for
    status_note: In the tool
    rows:
      - question: What does a programme buy, and where is it made?
        level: eu
        in_tool: "yes"
        answer: >-
          Input-output tables for all 27 member states and their trading
          partners, at 64 industries, every year.
        limit: >-
          64 industries is the floor of detail. Construction is a single
          industry.
        sources: [figaro, nama_10_gdp]
      - question: How many people does that work take?
        level: eu
        in_tool: "yes"
        answer: >-
          Persons employed and hours worked for the same 64 industries in
          every member state.
        limit: >-
          A few industries are missing in Luxembourg, Malta and Sweden and are
          filled from the broader sector.
        sources: [nama_10_a64_e]

  - step: Labour
    status_note: In the tool (resource 1)
    rows:
      - question: Are the industries already short of workers?
        level: eu
        in_tool: "yes"
        answer: >-
          The Commission's business surveys ask firms whether labour limits
          their activity: construction monthly, industry and services
          quarterly, 48 of the 64 industries.
        limit: >-
          Not asked in health and social care, education, public
          administration, retail and wholesale trade, energy and water,
          agriculture or mining.
        sources: [ecfin]
      - question: What about the sectors the surveys miss, such as social care?
        level: eu
        in_tool: partly
        answer: >-
          Job vacancy rates by broad sector, quarterly since 2001. Health and
          social work is reported by 26 of 27 member states (Denmark is
          missing).
        limit: >-
          One figure for the whole of health and social work: it cannot tell
          hospitals from residential care. Vacancy rates are measured
          differently from the survey shares, so the two cannot be mixed in
          one ranking without care. In the tool it is an alternative
          shortage measure for a whole run.
        sources: [jvs_q_nace2]
      - question: Which trades and occupations would the work need?
        level: national
        in_tool: Sweden only
        answer: >-
          Across the EU, only broad sector by one-digit occupation (ten
          groups, such as "craft and related trades"). Sweden publishes
          four-digit occupations by industry group, free. The Netherlands
          publishes vacancies by occupation and industry.
        limit: >-
          No EU table of detailed occupations by industry. The Labour Force
          Survey moves to a new industry classification in 2026, a break in
          the series.
        sources: [lfsa_eisn2, scb_yreg54bas, cbs_85081ned]
      - question: Which occupations are already in shortage?
        level: some
        in_tool: Sweden only
        answer: >-
          Vacancy rates for three-digit occupations from online job adverts in
          18 member states (experimental). Every country rates 436 occupations
          for the European Labour Authority's shortage report. National tools
          exist, for example in Germany, France and Sweden.
        limit: >-
          The European Labour Authority report states that each country uses
          its own method and that direct comparison needs caution. National
          tools are not comparable with each other.
        sources: [jvs_a_isco3_r1, ela_2025, ba_engpass, af_yrkesbarometer]
      - question: Could training fill the gap?
        level: eu
        in_tool: "no"
        answer: >-
          Graduates and vocational enrolment by detailed field of study, for
          example building and civil engineering, in about 25 member states.
        limit: >-
          This counts people qualifying, not training places that could be
          added. No EU-wide count of training capacity for the trades exists.
        sources: [educ_uoe_grad02, educ_uoe_enrs10]

  - step: Energy
    status_note: Proposed next resource
    rows:
      - question: How much energy would a programme use?
        level: eu
        in_tool: "no"
        answer: >-
          Energy use by the same 64 industries in every member state, required
          by EU law, to 2023 for all countries.
        limit: >-
          Not yet fully reconciled with the national accounts; a few cells are
          confidential.
        sources: [pefa, nrg_bal]
      - question: Is there enough electricity, and can it be connected?
        level: national
        in_tool: "no"
        answer: >-
          Across the EU: the power system adequacy assessment by bidding zone,
          and the installed stock of heat pumps and renewables by country.
        limit: >-
          Grid connection queues and capacity, and the number of installers,
          have no comparable EU data. They sit with national grid operators,
          regulators and industry bodies.
        sources: [entsoe_eraa, nrg_inf_hptc, nrg_inf_epcrw, capacitypedia]

  - step: Materials
    status_note: Possible later resource
    rows:
      - question: How much material would a programme use?
        level: eu
        in_tool: "no"
        answer: >-
          A research input-output database gives material use by industry for
          every member state.
        limit: >-
          Its licence is non-commercial and limited to universities, research
          institutes, NGOs and agencies; eligibility needs checking. Eurostat's
          own material accounts are for whole economies, not industries.
        sources: [exiobase, env_ac_mfa]
      - question: Are materials and equipment already short?
        level: eu
        in_tool: "no"
        answer: >-
          The same business surveys ask whether shortages of materials or
          equipment limit firms, for each manufacturing division and for
          construction, in about 25 member states.
        limit: >-
          A share of firms, not a quantity. Production capacity in tonnes or
          units is not published.
        sources: [ecfin, prodcom]

  - step: Ecological ceiling
    status_note: For discussion with Doughnut Economics Action Lab
    rows:
      - question: Is a country within its fair share of the climate and material limits?
        level: eu
        in_tool: "no"
        answer: >-
          Greenhouse gas footprints built on the same input-output tables, and
          material footprints, for every member state, compared with an equal
          share per person of each global limit.
        limit: >-
          The fair share is a choice (equal per person is the common one) and
          must be stated openly.
        sources: [env_ac_ghgfp, env_ac_rme, leeds_goodlife]
      - question: What would the programme itself emit?
        level: eu
        in_tool: "no"
        answer: >-
          Emissions by the same 64 industries, so a programme's emissions can
          be traced like its jobs.
        limit: >-
          Emissions only; other limits cannot be traced this way from official
          data.
        sources: [env_ac_ainah_r2, env_ac_ghgfp]
      - question: What about nitrogen, phosphorus, land, water and biodiversity?
        level: some
        in_tool: "no"
        answer: >-
          Research datasets give country shares for some of these, but end in
          2015 or earlier. The European Environment Agency assessed Europe as a
          whole in 2020. Switzerland has a national downscaling.
        limit: >-
          Dated, research-licensed, Europe-wide or national only. The recent
          global Doughnut monitor has no country data.
        sources: [fanning_2022, eea_2020, foen_footprints, fanning_raworth_2025]

  - step: Social foundation
    status_note: For discussion with Doughnut Economics Action Lab
    rows:
      - question: Who falls below a decent standard of living?
        level: eu
        in_tool: "no"
        answer: >-
          The EU household survey measures, for every member state, people
          unable to keep their home warm, in arrears on utility bills, in damp
          or overcrowded housing, at risk of poverty, or with unmet medical
          needs.
        limit: >-
          Measured well, but there is no agreed EU floor for most of these.
        sources: [eu_silc, epah]
      - question: Where should the floor be drawn?
        level: none
        in_tool: "no"
        answer: >-
          The EU sets targets for change (for example 15 million fewer people
          at risk of poverty by 2030), not floors per person. Research
          thresholds are set low enough that most EU countries pass them.
        limit: >-
          Any floor the tool draws (zero deprivation, a target, or the best
          performer) is a choice and has to be stated.
        sources: [pillar_targets, fanning_2022]
      - question: What about cities and regions?
        level: local
        in_tool: "no"
        answer: >-
          Doughnut Economics Action Lab's city portraits combine local
          statistics and local targets with national footprints scaled down.
        limit: >-
          No EU-wide local dataset; each place builds its own.
        sources: [deal_unrolled]

comparability:
  - problem: Firms in different countries answer the survey differently.
    effect: The share of firms reporting shortages cannot be compared directly between countries.
    mitigation: Each series is compared with its own history (built).
  - problem: One shock in 27 different countries.
    effect: The renovation work implied may not match what any country would do.
    mitigation: Named as a limit, with what can and cannot be compared (built). Countries can rerun the method with their own spending mix.
  - problem: 64 industries is the finest common detail.
    effect: Construction cannot be split into trades across the EU.
    mitigation: An occupation layer where a national register allows (Sweden, built).
  - problem: Sectors the surveys do not cover.
    effect: Their lines get no rating, so a care or education programme is largely unrated.
    mitigation: Job vacancy rate as the alternative measure (built), at broad-sector level and measured differently.
  - problem: National shortage lists use different methods.
    effect: They cannot rank countries.
    mitigation: Use them as a yes or no flag only, never as a scale.
  - problem: Classification changes.
    effect: The Labour Force Survey moves to a revised industry classification from 2026.
    mitigation: Keep the reference year before the break, or map the two.
  - problem: Ceilings and floors need a fairness rule.
    effect: Without one, footprints cannot be judged against a limit.
    mitigation: State the rule (equal share per person; zero deprivation or an EU target) and show how results change under another.

programmes: >-
  Programmes that spend mainly on construction, manufacturing and business
  services (renovation, energy infrastructure, industry) fall where the EU
  data is strongest. Programmes in public services fall where it is weakest.
  A social care programme, for example, would be largely unrated with the
  business surveys; with the job vacancy rate it gets one signal for all of
  health and social work in 26 member states, but nothing on the care
  occupations themselves outside the few countries with national data. The
  tool now shows, for each spending line, whether a shortage series exists
  before a run is made.

next_steps:
  - title: Materials and equipment shortages
    cost: Uses data already held
    text: >-
      The business survey files the tool already reads also record shortages
      of materials and equipment by industry. A second risk signal could follow
      the labour method almost unchanged.
  - title: Energy use and emissions of a programme
    cost: Two new Eurostat datasets, same 64 industries
    text: >-
      Energy accounts and air emissions accounts plug into the existing
      input-output step, giving each programme's energy needs and emissions by
      member state.
  - title: Energy poverty as social context
    cost: One new Eurostat dataset
    text: >-
      Showing how many people cannot keep their home warm in each member
      state would set a renovation programme against the need it meets.
  - title: Health and social care
    cost: Uses data already held
    text: >-
      Make the job vacancy rate available line by line for sectors the
      surveys miss, clearly marked as a different measure.
  - title: A national deep dive
    cost: Needs a national partner
    text: >-
      Repeat the Sweden layer in another country with register data, or with a
      partner who holds national shortage data, to show what the national tier
      looks like.

